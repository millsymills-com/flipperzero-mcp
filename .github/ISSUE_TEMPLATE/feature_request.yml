name: Feature request
description: A new tool, transport capability, or workflow.
labels: ["needs-triage", "enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The tool/behavior you want. Note if it implies device writes or RF transmission (both are gated).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
