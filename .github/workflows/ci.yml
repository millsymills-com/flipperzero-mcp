name: ci
on:
  pull_request:
  push:
    branches: [phase1]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src/ tests/
      - run: uv run --frozen ruff format --check src/ tests/
      - run: uv run --frozen ty check src/flipperzero_mcp/
      - run: uv run --frozen bandit -r src/flipperzero_mcp/ -c pyproject.toml
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -m "not integration" --cov=flipperzero_mcp --cov-report=term --cov-fail-under=80
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pip-audit
      - run: pipx run zizmor==1.24.1 .github/workflows/
