[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flipperzero-mcp"
version = "0.1.0"
description = "MCP server for the Flipper Zero (USB + WiFi protobuf RPC)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "millsymills-com" }]
keywords = ["flipper", "flipper-zero", "mcp", "model-context-protocol", "hardware", "fastmcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.4.1,<4.0.0",
    "pyserial>=3.5",
    "protobuf==6.33.5",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.2",
    "ruff>=0.15.16",
    "ty>=0.0.44",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.7.3",
    "pre-commit>=4.6.0",
    "grpcio-tools>=1.81.0",
]

[project.scripts]
flipperzero-mcp = "flipperzero_mcp.__main__:main"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["firmware"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","S","A","C4","DTZ","T20","SIM","TCH","RUF","PT","ARG","PTH","ERA","PL","PERF","FURB","LOG","TID"]
ignore = ["S101","PLR0913","PLR0915","PLR2004","PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101","ARG001","PLR2004","S106"]
"src/flipperzero_mcp/tools/**/*.py" = ["TC001","TC002"]
"src/flipperzero_mcp/rpc/protobuf_gen/**/*.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["flipperzero_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
respect-ignore-files = true

[tool.ty.rules]
unresolved-attribute = "error"
invalid-argument-type = "error"
invalid-return-type = "error"

[tool.ty.analysis]
# Generated protobuf modules build their message classes dynamically via the
# descriptor pool, so their attributes are statically invisible. Treat them as
# Any to avoid false unresolved-attribute errors in consumers.
replace-imports-with-any = ["flipperzero_mcp.rpc.protobuf_gen.**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
consider_namespace_packages = true
asyncio_mode = "auto"
markers = [
    "integration: requires a real Flipper (USB or WiFi). LOCAL ONLY.",
    "usb: integration test that needs a USB-connected Flipper.",
    "wifi: integration test that needs a WiFi dev board (FLIPPER_WIFI_HOST set).",
]
addopts = ["-ra","--strict-markers","--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["flipperzero_mcp"]
branch = true
# These modules are hardware/IO-coupled (live serial/socket I/O and Flipper RPC
# session negotiation over a real transport) and are validated by the opt-in
# tests/integration/ suite against a real device, not by unit tests. The varint
# framing codec inside protobuf_rpc IS unit-tested via tests/property/test_framing.py.
omit = [
    "tests/*",
    "src/flipperzero_mcp/__main__.py",
    "src/flipperzero_mcp/rpc/protobuf_gen/*",
    "src/flipperzero_mcp/rpc/protobuf_rpc.py",
    "src/flipperzero_mcp/transport/usb.py",
    "src/flipperzero_mcp/transport/wifi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover","if TYPE_CHECKING:","if __name__ == .__main__.","@overload","raise NotImplementedError","\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.hatch.build.targets.wheel]
packages = ["src/flipperzero_mcp"]

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2",
]
